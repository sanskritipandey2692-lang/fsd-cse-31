<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
    
     </hr>
</head>
<body>
    <h1>Registration Form</h1>
    <hr>
    <!--Registration Form-->
    <form method="post" action="submit.html">
        <!--FULL NAME-->
        <p>
            <label>FIRST NAME:</label>
            <input type="text" name="firstname" placeholder="Enter your first name" required>
        </p>
        <p>
            <label>LAST NAME:</label>
            <input type="text" name="lastname" placeholder="Enter your last name" required>
        </p>
        <p>
            <label>Father's Name:</label>
            <input type="text" name="father'sname" placeholder="Enter your father's name" required>
        </p>
        <p>
        <label>Mother's Name:</label>
        <input type="text" name="mother'sname" placeholder="Enter your mother's name" required>
        </p>
        <p>
            <label>Date OF Birth:</label>
            <input type="date" name="dateofbirth" required>
        </p>
        <p>
            <label>Email:</label>
            <input type="email" name="email" placeholder="Enter valid email address" required>
        </p>
        <p>
            <label>Gender:</label>
            <input type="radio" name="gender" value="male" required> Male
            <input type="radio" name="gender" value="female"> Female
        </p>
        <p>
            <label>CHOOSE COURSE:</label>
            <select name="course" required>
                <option value="">--Select Course--</option>
                <option value="btech">B.Tech</option>
                <option value="bca">BCA</option>
                <option value="mba">MBA</option>
                <option value="mca">MCA</option>
            </p>
            <br>


            <!-- hobbies
            <input type="radio" name="hobbies" value="singing" required> Singing
            <input type="radio" name="hobbies" value="dancing" required> Dancing
            <input type="radio" name="hobbies" value="readingbook" required> Reading book
            <input type="radio" name="hobbies" value="playingcricket" required> Playing cricket
        </p> -->
        <p>
            hobbies
        </p>
    <p>
        <label>Address:</label>
         <textarea name="address" rows="4" cols="40" placegholder="Enter your address" required></textarea>
    </p>
    <p>
    <label>Photo:</label>
    <input type="file" id="photo" name="photo" accept="image/*" required>
    </p>
     <p>
            <input type="submit" value="Submit">
            </p> 
    </form>
</body>
    

</html>
